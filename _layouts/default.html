<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10202c">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 홈">
          <span class="brand-mark" aria-hidden="true">M<span class="brand-dot">.</span></span>
          <span>{{ site.title }}</span>
        </a>
        <nav class="site-nav" aria-label="주 메뉴">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>홈</a>
          <a href="{{ '/categories/' | relative_url }}"{% if page.url contains '/categories/' %} aria-current="page"{% endif %}>카테고리</a>
          <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>글 목록</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>소개</a>
        </nav>
      </div>
    </header>

    <main id="content">{{ content }}</main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>{{ site.title }} <span aria-hidden="true">·</span> {{ site.description }}</p>
        <a href="{{ '/feed.xml' | relative_url }}">RSS 구독 <span aria-hidden="true">↗</span></a>
      </div>
    </footer>
  </body>
</html>
