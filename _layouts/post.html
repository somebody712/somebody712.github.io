---
layout: default
---
<article class="article">
  <a class="back" href="{{ '/' | relative_url }}">← 기록</a>
  <p class="article-meta">{{ page.date | date: '%Y. %m. %d.' }}{% if page.category %} · {{ page.category }}{% endif %}</p>
  <h1>{{ page.title | escape }}</h1>
  {% if page.description %}<p class="lead">{{ page.description | escape }}</p>{% endif %}
  <div class="prose">{{ content }}</div>
</article>
