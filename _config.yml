title: somebody712 기록
description: Portfolio
url: "https://somebody712.github.io"
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul
permalink: /posts/:title/
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-seo-tag
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - POST_TEMPLATE.md
  - Gemfile
  - Gemfile.lock
  - about.md
  - archive.md
  - feed.xml
  - categories/index.md
  - _data/portfolio.yml
  - _posts/2026-09-21-hello-markdown.md
  - _posts/2026-09-22-bugbounty-report.md
  - _posts/2026-09-22-contest-study-log.md
  - _posts/2026-09-22-ctf-writeup.md
  - _posts/2026-09-22-development-notes.md
  - _posts/2026-09-22-paper-reading.md
